<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 카카오톡 / 디스코드 공유 및 검색용 OG 태그 -->
    <title>StelCheck</title>
    <meta name="description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="StelCheck">
    <meta property="og:title" content="StelCheck">
    <meta property="og:description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    <meta property="og:image" content="https://i.postimg.cc/Y2GHtVsm/byeol.jpg">
    <meta property="og:url" content="https://my-chzzk-site.onrender.com">

    <style>
        body { 
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; 
            background-color: #0b0c10; 
            color: #fff; 
            padding: 30px 20px; 
        }
        
        h1 { 
            text-align: center; 
            color: #00ffa3; 
            margin-bottom: 35px; 
            font-size: 28px;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(0, 255, 163, 0.4);
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 24px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* 🛡️ 방패/휘장 외곽 프레임 바깥 감싸개 */
        .card-wrapper {
            position: relative;
            background: var(--crystal-color);
            padding: 2px; /* 휘장 테두리 두께 */
            /* 귀퉁이가 깎인 진짜 방패/휘장 컷팅 모양 */
            clip-path: polygon(
                16px 0, calc(100% - 16px) 0, 
                100% 16px, 100% calc(100% - 24px), 
                calc(100% - 24px) 100%, 24px 100%, 
                0 calc(100% - 24px), 0 16px
            );
            filter: drop-shadow(0 0 8px var(--glow-color));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .card-wrapper:hover {
            transform: translateY(-6px);
            filter: drop-shadow(0 0 18px var(--crystal-color));
        }

        /* 🛡️ 카드 내부 (어두운 바탕 및 텍스트 영역) */
        .card { 
            position: relative;
            background: #13151c; 
            padding: 22px 18px; 
            height: 100%;
            box-sizing: border-box;
            /* 내부 방패 컷팅 모양 동기화 */
            clip-path: polygon(
                15px 0, calc(100% - 15px) 0, 
                100% 15px, 100% calc(100% - 23px), 
                calc(100% - 23px) 100%, 23px 100%, 
                0 calc(100% - 23px), 0 15px
            );
        }

        /* 상단 크리스탈 엠블럼 포인트 */
        .card-wrapper::before {
            content: "◆";
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--crystal-color);
            font-size: 11px;
            z-index: 10;
            text-shadow: 0 0 8px var(--crystal-color);
        }

        /* 하단 크리스탈 엠블럼 포인트 */
        .card-wrapper::after {
            content: "▼";
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--crystal-color);
            font-size: 9px;
            z-index: 10;
            text-shadow: 0 0 8px var(--crystal-color);
        }

        /* 🔴 방송 중(LIVE) 일 때 강한 후광 효과 */
        .live-wrapper {
            filter: drop-shadow(0 0 15px var(--crystal-color)) !important;
        }

        /* =========================================================
           🎨 [11개 멤버별 휘장 크리스탈 고유 색상]
        ========================================================= */
        .card-wrapper:nth-child(1)  { --crystal-color: #ff4b5c; --glow-color: rgba(255, 75, 92, 0.4); }
        .card-wrapper:nth-child(2)  { --crystal-color: #ff9f43; --glow-color: rgba(255, 159, 67, 0.4); }
        .card-wrapper:nth-child(3)  { --crystal-color: #feca57; --glow-color: rgba(254, 202, 87, 0.4); }
        .card-wrapper:nth-child(4)  { --crystal-color: #1dd1a1; --glow-color: rgba(29, 209, 161, 0.4); }
        .card-wrapper:nth-child(5)  { --crystal-color: #48dbfb; --glow-color: rgba(72, 219, 251, 0.4); }
        .card-wrapper:nth-child(6)  { --crystal-color: #0abde3; --glow-color: rgba(10, 189, 227, 0.4); }
        .card-wrapper:nth-child(7)  { --crystal-color: #a855f7; --glow-color: rgba(168, 85, 247, 0.4); }
        .card-wrapper:nth-child(8)  { --crystal-color: #9c88ff; --glow-color: rgba(156, 136, 255, 0.4); }
        .card-wrapper:nth-child(9)  { --crystal-color: #ff6b6b; --glow-color: rgba(255, 107, 107, 0.4); }
        .card-wrapper:nth-child(10) { --crystal-color: #ff9ff3; --glow-color: rgba(255, 159, 243, 0.4); }
        .card-wrapper:nth-child(11) { --crystal-color: #00d2d3; --glow-color: rgba(0, 210, 211, 0.4); }

        /* 내부 요소 텍스트 스타일 */
        h3 { margin: 4px 0 10px 0; font-size: 19px; color: #ffffff; letter-spacing: -0.5px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 3px; font-size: 11px; font-weight: bold; }
        .badge-live { background: #ff0055; color: #fff; box-shadow: 0 0 10px rgba(255, 0, 85, 0.6); }
        .badge-off { background: #2c2f3a; color: #8c90a0; }
        .title { font-size: 13px; margin: 12px 0 8px 0; color: #d8dadf; word-break: break-all; line-height: 1.4; min-height: 36px; }
        .info { font-size: 12px; color: #828796; margin-bottom: 14px; }
        a { color: #00ffa3; text-decoration: none; font-weight: bold; font-size: 13px; display: inline-block; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>치지직 스트리머 상태</h1>
    <div class="grid">
        {% for s in streamers %}
        <div class="card-wrapper {% if s.is_live %}live-wrapper{% endif %}">
            <div class="card">
                <h3>{{ s.name }}</h3>
                {% if s.is_live %}
                    <span class="badge badge-live">LIVE</span>
                    <p class="title">{{ s.live.title }}</p>
                    <p class="info">시청자: {{ s.live.users }}명 | {{ s.live.category }}</p>
                    <a href="https://chzzk.naver.com/live/{{ s.id }}" target="_blank">방송 바로가기 &rarr;</a>
                {% else %}
                    <span class="badge badge-off">OFFLINE</span>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
