<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>StelCheck</title>
    <meta name="description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="StelCheck">
    <meta property="og:title" content="StelCheck">
    <meta property="og:description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    <meta property="og:image" content="https://i.postimg.cc/Y2GHtVsm/byeol.jpg">
    <meta property="og:url" content="https://my-chzzk-site.onrender.com">

    <style>
        :root {
            /* ★ postimages 직접 링크가 들어가는 변수 ★ */
            --crest-image-url: url('https://i.postimg.cc/JhtSq6S8/hwijang.png');
        }

        body { 
            font-family: sans-serif; 
            background-color: #0b0c10; 
            color: #fff; 
            padding: 40px 20px; 
        }
        
        h1 { 
            text-align: center; 
            color: #00ffa3; 
            margin-bottom: 45px; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 35px 24px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* 🛡️ 카드 본체 메인 틀 */
        .card-wrapper {
            position: relative;
            background: #12141a;
            border-radius: 12px;
            /* 휘장 안쪽 공간에 글씨가 깔끔히 들어가도록 내부에 넉넉한 여백 배치 */
            padding: 35px 24px 30px 24px; 
            overflow: visible; /* 휘장이 카드 바깥으로 크게 돌출되도록 설정 */
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .card-wrapper:hover {
            transform: translateY(-6px);
        }

        /* 🛡️ 겉을 둘러싸는 휘장 프레임 (배경 레이어로 이동) */
        .card-wrapper::before {
            content: "";
            position: absolute;
            /* 카드의 상하좌우 바깥으로 살짝 삐져나오도록 상하좌우 크기 확장 */
            top: -16px;
            left: -12px;
            right: -12px;
            bottom: -20px;
            background-image: var(--crest-image-url);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 1; /* 글씨 뒤로 레이어 배치 */
            filter: var(--hue-filter, none);
        }

        /* 🔴 방송 중(LIVE) 카드 강조 glow */
        .live-wrapper::before {
            filter: var(--hue-filter, none) drop-shadow(0 0 14px rgba(0, 255, 163, 0.85));
        }

        /* =========================================================
           🎨 [11개 칸 색상 변환 (hue-rotate 각도 조정)]
        ========================================================= */
        .card-wrapper:nth-child(1)  { --hue-filter: hue-rotate(140deg); }
        .card-wrapper:nth-child(2)  { --hue-filter: hue-rotate(170deg); }
        .card-wrapper:nth-child(3)  { --hue-filter: hue-rotate(200deg); }
        .card-wrapper:nth-child(4)  { --hue-filter: hue-rotate(270deg); }
        .card-wrapper:nth-child(5)  { --hue-filter: hue-rotate(320deg); }
        .card-wrapper:nth-child(6)  { --hue-filter: hue-rotate(0deg); }  
        .card-wrapper:nth-child(7)  { --hue-filter: hue-rotate(40deg); } 
        .card-wrapper:nth-child(8)  { --hue-filter: hue-rotate(70deg); } 
        .card-wrapper:nth-child(9)  { --hue-filter: hue-rotate(110deg); }
        .card-wrapper:nth-child(10) { --hue-filter: hue-rotate(90deg); } 
        .card-wrapper:nth-child(11) { --hue-filter: hue-rotate(340deg); }

        /* 📝 최상단으로 빼낸 텍스트 및 버튼 영역 */
        .card-content {
            position: relative;
            z-index: 10; /* 휘장(z-index:1)보다 위로 노출 */
        }

        h3 { margin: 0 0 10px 0; font-size: 18px; color: #ffffff; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-live { background: #ff0055; color: #fff; box-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
        .badge-off { background: #3a3d4a; color: #a0a5b5; }
        .title { font-size: 14px; margin: 12px 0 8px 0; color: #e3e5e8; word-break: break-all; line-height: 1.4; min-height: 38px; }
        .info { font-size: 12px; color: #9498a4; margin-bottom: 14px; }
        a { color: #00ffa3; text-decoration: none; font-weight: bold; font-size: 13px; display: inline-block; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>치지직 스트리머 상태</h1>
    <div class="grid">
        {% for s in streamers %}
        <div class="card-wrapper {% if s.is_live %}live-wrapper{% endif %}">
            <div class="card-content">
                <h3>{{ s.name }}</h3>
                {% if s.is_live %}
                    <span class="badge badge-live">LIVE</span>
                    <p class="title">{{ s.live.title }}</p>
                    <p class="info">시청자: {{ s.live.users }}명 | {{ s.live.category }}</p>
                    <a href="https://chzzk.naver.com/live/{{ s.id }}" target="_blank">방송 바로가기 &rarr;</a>
                {% else %}
                    <span class="badge badge-off">OFFLINE</span>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
