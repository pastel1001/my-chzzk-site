<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 카카오톡 / 디스코드 공유 및 검색용 OG 태그 -->
    <title>StelCheck</title>
    <meta name="description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="StelCheck">
    <meta property="og:title" content="StelCheck">
    <meta property="og:description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    <meta property="og:image" content="https://i.postimg.cc/Y2GHtVsm/byeol.jpg">
    <meta property="og:url" content="https://my-chzzk-site.onrender.com">

    <style>
        body { font-family: sans-serif; background-color: #141517; color: #fff; padding: 20px; }
        h1 { text-align: center; color: #00ffa3; margin-bottom: 30px; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* 🛡️ 크리스탈 휘장 기본 카드 공통 스타일 */
        .card { 
            position: relative;
            background: #0f0f12; 
            padding: 20px 18px; 
            border-radius: 12px; 
            overflow: hidden; /* 크리스탈 장식이 카드 밖으로 나가지 않게 */
            
            /* 개별 크리스탈 색상 변수 사용 */
            border: 1px solid var(--crystal-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* 크리스탈 휘장 (의사 요소로 구현) */
        .card::before,
        .card::after {
            content: "";
            position: absolute;
            background: var(--crystal-color);
            filter: drop-shadow(0 0 10px var(--crystal-color));
        }

        /* 상단 크리스탈 테두리 */
        .card::before {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: polygon(
                /* 상단 평평한 테두리 */
                0% 0%, 100% 0%, 
                /* 오른쪽 측면 날카로운 크리스탈 */
                100% 10%, 98% 12%, 100% 15%, 99% 18%, 100% 21%, 
                /* 하단 방패 연결 */
                100% 100%, 0% 100%, 
                /* 왼쪽 측면 날카로운 크리스탈 */
                0% 21%, 1% 18%, 0% 15%, 2% 12%, 0% 10%
            );
        }

        /* 하단 크리스탈 장식 (그라디언트 추가) */
        .card::after {
            bottom: -1px; /* 테두리와 겹치게 */
            left: 0;
            width: 100%;
            height: 100px; /* 적절한 높이 */
            background: linear-gradient(180deg, rgba(var(--crystal-color-rgb), 0) 0%, rgba(var(--crystal-color-rgb), 1) 100%);
            clip-path: polygon(
                /* 하단 뾰족한 형태 */
                0% 100%, 50% 100%, 100% 100%, 
                /* 3개의 크리스탈 */
                100% 80%, 90% 60%, 80% 80%, 70% 60%, 
                /* 중앙 크리스탈 */
                50% 0%, 
                30% 60%, 20% 80%, 10% 60%, 0% 80%
            );
            filter: drop-shadow(0 0 10px var(--crystal-color));
        }

        /* 🔴 방송 중(LIVE) 강한 크리스탈 글로우 효과 */
        .live-card::after {
            filter: drop-shadow(0 0 20px var(--crystal-color));
        }

        /* =========================================================
           🎨 [11개 칸 개별 크리스탈 색상 설정]
        ========================================================= */
        /* 1번째 칸 */
        .card:nth-child(1) {
            --crystal-color: #ff4b5c;
            --crystal-color-rgb: 255, 75, 92;
        }
        /* 2번째 칸 */
        .card:nth-child(2) {
            --crystal-color: #ff9f43;
            --crystal-color-rgb: 255, 159, 67;
        }
        /* 3번째 칸 */
        .card:nth-child(3) {
            --crystal-color: #feca57;
            --crystal-color-rgb: 254, 202, 87;
        }
        /* 4번째 칸 */
        .card:nth-child(4) {
            --crystal-color: #1dd1a1;
            --crystal-color-rgb: 29, 209, 161;
        }
        /* 5번째 칸 */
        .card:nth-child(5) {
            --crystal-color: #48dbfb;
            --crystal-color-rgb: 72, 219, 251;
        }
        /* 6번째 칸 */
        .card:nth-child(6) {
            --crystal-color: #0abde3;
            --crystal-color-rgb: 10, 189, 227;
        }
        /* 7번째 칸 */
        .card:nth-child(7) {
            --crystal-color: #5f27cd;
            --crystal-color-rgb: 95, 39, 205;
        }
        /* 8번째 칸 */
        .card:nth-child(8) {
            --crystal-color: #9c88ff;
            --crystal-color-rgb: 156, 136, 255;
        }
        /* 9번째 칸 */
        .card:nth-child(9) {
            --crystal-color: #ff6b6b;
            --crystal-color-rgb: 255, 107, 107;
        }
        /* 10번째 칸 */
        .card:nth-child(10) {
            --crystal-color: #ff9ff3;
            --crystal-color-rgb: 255, 159, 243;
        }
        /* 11번째 칸 */
        .card:nth-child(11) {
            --crystal-color: #00d2d3;
            --crystal-color-rgb: 0, 210, 211;
        }

        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-live { background: #ff0055; color: #fff; }
        .badge-off { background: #4e515d; color: #ccc; }
        .title { font-size: 14px; margin: 12px 0; color: #e3e5e8; word-break: break-all; }
        .info { font-size: 12px; color: #9498a4; margin-bottom: 12px; }
        a { color: #00ffa3; text-decoration: none; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>
    <h1>치지직 스트리머 상태</h1>
    <div class="grid">
        {% for s in streamers %}
        <div class="card {% if s.is_live %}live-card{% endif %}">
            <h3>{{ s.name }}</h3>
            {% if s.is_live %}
                <span class="badge badge-live">LIVE</span>
                <p class="title">{{ s.live.title }}</p>
                <p class="info">시청자: {{ s.live.users }}명 | {{ s.live.category }}</p>
                <a href="https://chzzk.naver.com/live/{{ s.id }}" target="_blank">방송 바로가기 &rarr;</a>
            {% else %}
                <span class="badge badge-off">OFFLINE</span>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
