<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>StelCheck</title>
    <meta name="description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="StelCheck">
    <meta property="og:title" content="StelCheck">
    <meta property="og:description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    <meta property="og:image" content="https://i.postimg.cc/Y2GHtVsm/byeol.jpg">
    <meta property="og:url" content="https://my-chzzk-site.onrender.com">

    <style>
        :root {
            /* ★ postimages에 올린 휘장 PNG 이미지의 직접 링크를 여기에 넣으세요 ★ */
            --crest-image-url: url('https://i.postimg.cc/JhtSq6S8/hwijang.png');
        }

        body { 
            font-family: sans-serif; 
            background-color: #0b0c10; 
            color: #fff; 
            padding: 30px 20px; 
        }
        
        h1 { 
            text-align: center; 
            color: #00ffa3; 
            margin-bottom: 35px; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 24px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* 🛡️ 진짜 휘장 이미지 카드 */
        .card-wrapper {
            position: relative;
            background: #12141a;
            border-radius: 12px;
            padding: 30px 22px 25px 22px; /* 휘장 테두리 안쪽에 글자가 위치하도록 여백 조정 */
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .card-wrapper:hover {
            transform: translateY(-6px);
        }

        /* 휘장 PNG 이미지 덮어씌우기 */
        .card-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: var(--crest-image-url);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            pointer-events: none; /* 클릭 방해 금지 */
            z-index: 10;
            filter: var(--hue-filter, none);
        }

        /* 🔴 방송 중(LIVE) 카드 강조 */
        .live-wrapper::before {
            filter: var(--hue-filter, none) drop-shadow(0 0 12px rgba(0, 255, 163, 0.8));
        }

        /* =========================================================
           🎨 [11개 칸 색상 변환 (hue-rotate 각도 조정)]
        ========================================================= */
        .card-wrapper:nth-child(1)  { --hue-filter: hue-rotate(140deg); } /* 빨강 계열 */
        .card-wrapper:nth-child(2)  { --hue-filter: hue-rotate(170deg); } /* 주황 계열 */
        .card-wrapper:nth-child(3)  { --hue-filter: hue-rotate(200deg); } /* 노랑/골드 */
        .card-wrapper:nth-child(4)  { --hue-filter: hue-rotate(270deg); } /* 초록 계열 */
        .card-wrapper:nth-child(5)  { --hue-filter: hue-rotate(320deg); } /* 민트 계열 */
        .card-wrapper:nth-child(6)  { --hue-filter: hue-rotate(0deg); }   /* 원본 블루 */
        .card-wrapper:nth-child(7)  { --hue-filter: hue-rotate(40deg); }  /* 보라 계열 */
        .card-wrapper:nth-child(8)  { --hue-filter: hue-rotate(70deg); }  /* 연보라 계열 */
        .card-wrapper:nth-child(9)  { --hue-filter: hue-rotate(110deg); } /* 분홍 계열 */
        .card-wrapper:nth-child(10) { --hue-filter: hue-rotate(90deg); }  /* 마젠타 계열 */
        .card-wrapper:nth-child(11) { --hue-filter: hue-rotate(340deg); } /* 청록 계열 */

        /* 내부 콘텐츠 텍스트 스타일 */
        .card-content {
            position: relative;
            z-index: 5;
        }

        h3 { margin: 0 0 10px 0; font-size: 18px; color: #ffffff; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-live { background: #ff0055; color: #fff; box-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
        .badge-off { background: #3a3d4a; color: #a0a5b5; }
        .title { font-size: 14px; margin: 12px 0 8px 0; color: #e3e5e8; word-break: break-all; line-height: 1.4; min-height: 38px; }
        .info { font-size: 12px; color: #9498a4; margin-bottom: 14px; }
        a { color: #00ffa3; text-decoration: none; font-weight: bold; font-size: 13px; display: inline-block; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>치지직 스트리머 상태</h1>
    <div class="grid">
        {% for s in streamers %}
        <div class="card-wrapper {% if s.is_live %}live-wrapper{% endif %}">
            <div class="card-content">
                <h3>{{ s.name }}</h3>
                {% if s.is_live %}
                    <span class="badge badge-live">LIVE</span>
                    <p class="title">{{ s.live.title }}</p>
                    <p class="info">시청자: {{ s.live.users }}명 | {{ s.live.category }}</p>
                    <a href="https://chzzk.naver.com/live/{{ s.id }}" target="_blank">방송 바로가기 &rarr;</a>
                {% else %}
                    <span class="badge badge-off">OFFLINE</span>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
