<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>치지직 라이브 상태</title>
    <style>
        body { font-family: sans-serif; background-color: #141517; color: #fff; padding: 20px; }
        h1 { text-align: center; color: #00ffa3; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1f2026; padding: 16px; border-radius: 10px; border: 1px solid #2e3038; }
        .live-card { border-color: #00ffa3; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-live { background: #ff0055; color: #fff; }
        .badge-off { background: #4e515d; color: #ccc; }
        .title { font-size: 14px; margin: 10px 0; color: #e3e5e8; word-break: break-all; }
        .info { font-size: 12px; color: #9498a4; }
        a { color: #00ffa3; text-decoration: none; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>
    <h1>치지직 스트리머 상태</h1>
    <div class="grid">
        {% for s in streamers %}
        <div class="card {% if s.is_live %}live-card{% endif %}">
            <h3>{{ s.name }}</h3>
            {% if s.is_live %}
                <span class="badge badge-live">LIVE</span>
                <p class="title">{{ s.live.title }}</p>
                <p class="info">시청자: {{ s.live.users }}명 | {{ s.live.category }}</p>
                <a href="https://chzzk.naver.com/live/{{ s.id }}" target="_blank">방송 바로가기 &rarr;</a>
            {% else %}
                <span class="badge badge-off">OFFLINE</span>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
