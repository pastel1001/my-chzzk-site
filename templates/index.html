<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 카카오톡 / 디스코드 공유 및 검색용 OG 태그 -->
    <title>StelCheck</title>
    <meta name="description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="StelCheck">
    <meta property="og:title" content="StelCheck">
    <meta property="og:description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    <meta property="og:image" content="https://i.postimg.cc/Y2GHtVsm/byeol.jpg">
    <meta property="og:url" content="https://my-chzzk-site.onrender.com">

    <style>
        body { font-family: sans-serif; background-color: #141517; color: #fff; padding: 20px; }
        h1 { text-align: center; color: #00ffa3; margin-bottom: 30px; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* 🛡️ 휘장 기본 카드 공통 스타일 */
        .card { 
            position: relative;
            background: #1f2026; 
            padding: 20px 18px; 
            border-radius: 12px; 
            
            border: 2px solid #e0c268;
            outline: 1px dashed rgba(245, 224, 139, 0.6);
            outline-offset: -7px;
            
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* =========================================================
           🎨 [11개 칸 개별 색상 설정] 아래 색상 코드를 직접 변경하세요!
        ========================================================= */
        /* 1번째 칸 */
        .card:nth-child(1) { border-color: #ff4b5c; outline-color: rgba(255, 75, 92, 0.5); box-shadow: 0 0 12px rgba(255, 75, 92, 0.3); }
        /* 2번째 칸 */
        .card:nth-child(2) { border-color: #ff9f43; outline-color: rgba(255, 159, 67, 0.5); box-shadow: 0 0 12px rgba(255, 159, 67, 0.3); }
        /* 3번째 칸 */
        .card:nth-child(3) { border-color: #feca57; outline-color: rgba(254, 202, 87, 0.5); box-shadow: 0 0 12px rgba(254, 202, 87, 0.3); }
        /* 4번째 칸 */
        .card:nth-child(4) { border-color: #1dd1a1; outline-color: rgba(29, 209, 161, 0.5); box-shadow: 0 0 12px rgba(29, 209, 161, 0.3); }
        /* 5번째 칸 */
        .card:nth-child(5) { border-color: #48dbfb; outline-color: rgba(72, 219, 251, 0.5); box-shadow: 0 0 12px rgba(72, 219, 251, 0.3); }
        /* 6번째 칸 */
        .card:nth-child(6) { border-color: #0abde3; outline-color: rgba(10, 189, 227, 0.5); box-shadow: 0 0 12px rgba(10, 189, 227, 0.3); }
        /* 7번째 칸 */
        .card:nth-child(7) { border-color: #5f27cd; outline-color: rgba(95, 39, 205, 0.5); box-shadow: 0 0 12px rgba(95, 39, 205, 0.3); }
        /* 8번째 칸 */
        .card:nth-child(8) { border-color: #9c88ff; outline-color: rgba(156, 136, 255, 0.5); box-shadow: 0 0 12px rgba(156, 136, 255, 0.3); }
        /* 9번째 칸 */
        .card:nth-child(9) { border-color: #ff6b6b; outline-color: rgba(255, 107, 107, 0.5); box-shadow: 0 0 12px rgba(255, 107, 107, 0.3); }
        /* 10번째 칸 */
        .card:nth-child(10) { border-color: #ff9ff3; outline-color: rgba(255, 159, 243, 0.5); box-shadow: 0 0 12px rgba(255, 159, 243, 0.3); }
        /* 11번째 칸 */
        .card:nth-child(11) { border-color: #00d2d3; outline-color: rgba(0, 210, 211, 0.5); box-shadow: 0 0 12px rgba(0, 210, 211, 0.3); }

        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-live { background: #ff0055; color: #fff; }
        .badge-off { background: #4e515d; color: #ccc; }
        .title { font-size: 14px; margin: 12px 0; color: #e3e5e8; word-break: break-all; }
        .info { font-size: 12px; color: #9498a4; margin-bottom: 12px; }
        a { color: #00ffa3; text-decoration: none; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>
    <h1>치지직 스트리머 상태</h1>
    <div class="grid">
        {% for s in streamers %}
        <div class="card {% if s.is_live %}live-card{% endif %}">
            <h3>{{ s.name }}</h3>
            {% if s.is_live %}
                <span class="badge badge-live">LIVE</span>
                <p class="title">{{ s.live.title }}</p>
                <p class="info">시청자: {{ s.live.users }}명 | {{ s.live.category }}</p>
                <a href="https://chzzk.naver.com/live/{{ s.id }}" target="_blank">방송 바로가기 &rarr;</a>
            {% else %}
                <span class="badge badge-off">OFFLINE</span>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
