<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 카카오톡 / 디스코드 공유 및 검색용 OG 태그 -->
    <title>StelCheck</title>
    <meta name="description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="StelCheck">
    <meta property="og:title" content="StelCheck">
    <meta property="og:description" content="스텔라이브 멤버들의 치지직 방송 상태를 실시간으로 확인하세요.">
    <meta property="og:image" content="https://i.postimg.cc/Y2GHtVsm/byeol.jpg">
    <meta property="og:url" content="https://my-chzzk-site.onrender.com">

    <style>
        body { font-family: sans-serif; background-color: #121316; color: #fff; padding: 20px; }
        h1 { text-align: center; color: #00ffa3; margin-bottom: 30px; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* 🛡️ 게이밍 휘장 프레임 카드 */
        .card { 
            position: relative;
            background: #1a1b20; 
            padding: 22px 18px; 
            border-radius: 12px; 
            
            /* 카드 메인 휘장 테두리 */
            border: 2px solid var(--crystal-color);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5),
                        0 4px 15px rgba(0, 0, 0, 0.6), 
                        0 0 12px var(--glow-color);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3),
                        0 8px 25px rgba(0, 0, 0, 0.8), 
                        0 0 22px var(--glow-color);
        }

        /* 상단 휘장 보석 포인트 */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 5px;
            background: var(--crystal-color);
            border-radius: 0 0 6px 6px;
            box-shadow: 0 0 10px var(--crystal-color);
        }

        /* 하단 크리스탈 라인 포인트 */
        .card::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--crystal-color), transparent);
            box-shadow: 0 0 8px var(--crystal-color);
        }

        /* 🔴 방송 중(LIVE) 일 때 테두리 및 빛 강조 */
        .live-card {
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4),
                        0 4px 20px rgba(0, 0, 0, 0.8), 
                        0 0 20px var(--crystal-color);
        }

        /* =========================================================
           🎨 [11개 칸 개별 휘장 색상 설정]
        ========================================================= */
        /* 1번째 칸 */
        .card:nth-child(1) { --crystal-color: #ff4b5c; --glow-color: rgba(255, 75, 92, 0.35); }
        /* 2번째 칸 */
        .card:nth-child(2) { --crystal-color: #ff9f43; --glow-color: rgba(255, 159, 67, 0.35); }
        /* 3번째 칸 */
        .card:nth-child(3) { --crystal-color: #feca57; --glow-color: rgba(254, 202, 87, 0.35); }
        /* 4번째 칸 */
        .card:nth-child(4) { --crystal-color: #1dd1a1; --glow-color: rgba(29, 209, 161, 0.35); }
        /* 5번째 칸 */
        .card:nth-child(5) { --crystal-color: #48dbfb; --glow-color: rgba(72, 219, 251, 0.35); }
        /* 6번째 칸 */
        .card:nth-child(6) { --crystal-color: #0abde3; --glow-color: rgba(10, 189, 227, 0.35); }
        /* 7번째 칸 */
        .card:nth-child(7) { --crystal-color: #5f27cd; --glow-color: rgba(95, 39, 205, 0.35); }
        /* 8번째 칸 */
        .card:nth-child(8) { --crystal-color: #9c88ff; --glow-color: rgba(156, 136, 255, 0.35); }
        /* 9번째 칸 */
        .card:nth-child(9) { --crystal-color: #ff6b6b; --glow-color: rgba(255, 107, 107, 0.35); }
        /* 10번째 칸 */
        .card:nth-child(10) { --crystal-color: #ff9ff3; --glow-color: rgba(255, 159, 243, 0.35); }
        /* 11번째 칸 */
        .card:nth-child(11) { --crystal-color: #00d2d3; --glow-color: rgba(0, 210, 211, 0.35); }

        /* 내부 텍스트 및 태그 스타일 */
        h3 { margin: 0 0 10px 0; font-size: 18px; color: #ffffff; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-live { background: #ff0055; color: #fff; box-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
        .badge-off { background: #3a3d4a; color: #a0a5b5; }
        .title { font-size: 14px; margin: 12px 0 8px 0; color: #e3e5e8; word-break: break-all; line-height: 1.4; }
        .info { font-size: 12px; color: #9498a4; margin-bottom: 14px; }
        a { color: #00ffa3; text-decoration: none; font-weight: bold; font-size: 13px; display: inline-block; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>치지직 스트리머 상태</h1>
    <div class="grid">
        {% for s in streamers %}
        <div class="card {% if s.is_live %}live-card{% endif %}">
            <h3>{{ s.name }}</h3>
            {% if s.is_live %}
                <span class="badge badge-live">LIVE</span>
                <p class="title">{{ s.live.title }}</p>
                <p class="info">시청자: {{ s.live.users }}명 | {{ s.live.category }}</p>
                <a href="https://chzzk.naver.com/live/{{ s.id }}" target="_blank">방송 바로가기 &rarr;</a>
            {% else %}
                <span class="badge badge-off">OFFLINE</span>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
